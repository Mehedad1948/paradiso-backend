# Pings the Render free instance so it doesn't spin down after 15 minutes idle.
# GitHub can delay scheduled runs, so this uses the shortest allowed interval.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health endpoint
        env:
          HEALTH_URL: https://paradiso-backend-g4zx.onrender.com/health
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "$HEALTH_URL"
